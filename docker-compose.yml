services:
  local-task-app:
    build: .
    container_name: local-task-app
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    env_file:
      - .env
    networks:
      - localtask-net

networks:
  localtask-net:
    external: true