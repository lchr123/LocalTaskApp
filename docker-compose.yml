services:
  local-task-app:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: local-task-app
    ports:
      - "8081:8081"
    env_file:
      - .env
    networks:
      - localtask-net

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - localtask-net
    depends_on:
      - local-task-app

networks:
  localtask-net:
    external: true